[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-science"
version = "0.1.0"
description = "Adversarial preregistered scientific validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
veritas = "veritas.cli:main"

[tool.setuptools.packages.find]
include = ["veritas*"]
