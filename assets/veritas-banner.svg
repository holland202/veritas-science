<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Veritas Science — adversarial scientific validation</title>
  <desc id="desc">A dark scientific banner with a cyan and gold shield containing a check mark, surrounded by protocol, evidence, attack, and verdict nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.52" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71f6ff"/>
      <stop offset="1" stop-color="#16b8d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe69a"/>
      <stop offset="1" stop-color="#e0a928"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8ed8e8" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="358" rx="23" fill="url(#grid)" stroke="#2a6a7b" stroke-opacity=".65"/>
  <path d="M0 292 C245 230 330 350 565 278 S1010 230 1400 300" fill="none" stroke="#13bfd8" stroke-opacity=".16" stroke-width="2"/>
  <path d="M0 312 C245 250 330 370 565 298 S1010 250 1400 320" fill="none" stroke="#e1ad39" stroke-opacity=".12" stroke-width="1"/>

  <!-- evidence circuit -->
  <g fill="none" stroke="#54dce9" stroke-width="2" stroke-opacity=".72">
    <path d="M82 92H216L274 150"/><path d="M82 268H216L274 210"/>
    <path d="M1118 150L1180 92H1318"/><path d="M1118 210L1180 268H1318"/>
  </g>
  <g fill="#07151d" stroke="#54dce9" stroke-width="2">
    <circle cx="82" cy="92" r="7"/><circle cx="82" cy="268" r="7"/>
    <circle cx="1318" cy="92" r="7"/><circle cx="1318" cy="268" r="7"/>
  </g>
  <g fill="#a5eaf1" font-family="monospace" font-size="13" letter-spacing="2">
    <text x="98" y="88">PROTOCOL</text><text x="98" y="264">EVIDENCE</text>
    <text x="1194" y="88">ATTACK</text><text x="1194" y="264">VERDICT</text>
  </g>

  <!-- shield mark -->
  <g transform="translate(300 54)">
    <path d="M100 0L194 35V124C194 183 155 226 100 252C45 226 6 183 6 124V35Z" fill="#091a28" stroke="url(#cyan)" stroke-width="5" filter="url(#glowCyan)"/>
    <path d="M100 23L169 49V120C169 164 142 198 100 220C58 198 31 164 31 120V49Z" fill="none" stroke="#d7faff" stroke-opacity=".28" stroke-width="2"/>
    <path d="M55 125L87 157L148 91" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGold)"/>
    <circle cx="100" cy="126" r="91" fill="none" stroke="#e9c15a" stroke-opacity=".32" stroke-dasharray="3 12" stroke-width="2"/>
  </g>

  <!-- title -->
  <g transform="translate(570 91)">
    <text x="0" y="72" fill="#f4fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="8">VERITAS</text>
    <text x="4" y="116" fill="url(#cyan)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="8">SCIENCE</text>
    <path d="M3 145H690" stroke="url(#gold)" stroke-width="3"/>
    <text x="4" y="181" fill="#c9dce4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="3">EVIDENCE-FIRST • FAIL-CLOSED • ADVERSARIAL</text>
  </g>

  <!-- status lights -->
  <g transform="translate(574 302)">
    <circle cx="5" cy="0" r="4" fill="#70f6ff"/><text x="18" y="5" fill="#76dce8" font-family="monospace" font-size="12" letter-spacing="1">CLAIM → PROTOCOL → PROOF</text>
    <circle cx="275" cy="0" r="4" fill="#e6b63e"/><text x="288" y="5" fill="#e6c66f" font-family="monospace" font-size="12" letter-spacing="1">NO UNCONDITIONAL TRUTH</text>
  </g>
</svg>
