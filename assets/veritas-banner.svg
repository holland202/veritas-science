<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">The Veritas Seal — adversarial, preregistered, reproducible science</title>
  <desc id="desc">A dark scientific instrument banner with an angular V inside an incomplete geometric seal, a deliberate fracture, measurement trace, and the Veritas workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080a0d"/><stop offset="1" stop-color="#111923"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f5f4"/><stop offset="1" stop-color="#aebbc3"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be7ff"/><stop offset="1" stop-color="#287ea4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b6d8e5" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1400" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="358" rx="19" fill="url(#grid)" stroke="#8ca8b5" stroke-opacity=".35"/>
  <g transform="translate(160 48)">
    <!-- incomplete seal: the gap is intentional -->
    <path d="M122 4A128 128 0 0 1 244 94M244 142A128 128 0 0 1 40 236M40 236A128 128 0 0 1 0 105M0 105A128 128 0 0 1 74 18" fill="none" stroke="url(#blue)" stroke-width="5"/>
    <!-- fracture bars -->
    <path d="M231 86l28-20M236 101l31-19" stroke="#e8eef0" stroke-width="4"/>
    <path d="M74 18L122 4" stroke="#e8eef0" stroke-width="3"/>
    <!-- angular V instrument -->
    <path d="M45 57L116 221L185 57" fill="none" stroke="url(#ink)" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M73 62L116 165L158 62" fill="none" stroke="#2d91b4" stroke-width="3"/>
    <!-- measurement trace -->
    <path d="M-26 151H35L54 132L72 171L91 151H207L226 128L245 151H278" fill="none" stroke="#d9edf2" stroke-width="2" opacity=".9"/>
    <circle cx="91" cy="151" r="4" fill="#9be7ff"/><circle cx="226" cy="128" r="4" fill="#9be7ff"/>
  </g>
  <g transform="translate(520 82)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="64" fill="#f1f4f4" font-size="64" font-weight="700" letter-spacing="9">VERITAS</text>
    <text x="4" y="108" fill="#8ed9ef" font-size="23" font-weight="600" letter-spacing="7">SCIENCE</text>
    <line x1="4" y1="137" x2="770" y2="137" stroke="#6fa6b8" stroke-width="2"/>
    <text x="4" y="177" fill="#d3dde0" font-size="18" letter-spacing="3">ADVERSARIAL • PREREGISTERED • REPRODUCIBLE</text>
    <text x="4" y="232" fill="#91a7af" font-family="monospace" font-size="15" letter-spacing="2">CLAIM → FREEZE → EXECUTE → ATTACK → VERDICT → REPLICATE</text>
    <text x="4" y="278" fill="#5f9eb2" font-family="monospace" font-size="13" letter-spacing="1">THE CLAIM SURVIVED AN ATTEMPT TO BREAK IT</text>
  </g>
</svg>
